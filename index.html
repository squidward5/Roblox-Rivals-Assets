    }

    ::-webkit-scrollbar-thumb {

    }

    .search-bar {

      top: 125px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 999;
    }

    .search-bar .nav-container {

    }

    .search-wrapper {
      width: 55px;
      height: 55px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      cursor: pointer;
      overflow: hidden;

      position: relative;
    }

    .search-wrapper:hover {

    }

    }

    .search-wrapper.expanded {

    .search-icon {

    }

    }

    body {

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 100px;
      overflow-y: auto;
      scrollbar-width: thin;
    }


    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 30px;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }

    .logo {
      font-size: 1.7rem;
      font-weight: bold;
      background: linear-gradient(to top, #00acff, #00e4ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      margin: 0;
    }

    nav {
      display: flex;
      gap: 25px;
      margin-left: auto;
    }

    .nav-container {
      position: relative;
      padding: 15px 30px;
      border-radius: 500px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.25);
    }

    .nav-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 500px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.15));
      z-index: 0;
    }

    .nav-container > * {
      position: relative;
      z-index: 1;
    }

    nav {
      display: flex;
      gap: 20px;
      margin-left: auto;
      flex-wrap: wrap;
    } 

    nav button {
      background: transparent;
      border: none;
      color: #7d7d7d;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      transition: color 0.25s ease;
    }

    nav button::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      height: 3px;
      width: 0%;
      background: #fff;
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    nav button:hover {
      color: #bfbfbf;
    }

    nav button:hover::after { width: 50%; }

    nav button.active-tab {
      color: #fff;
    }

    nav button.active-tab::after {
      width: 100%;
    }

    .tab {
      display: none;
      padding: 40px 20px;
      position: relative;
    }

    @keyframes smoothFadeDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #icons.tab.active {
      justify-content: flex-start;
      align-items: center;
      padding-top: 20px;
    }

    .tab.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: calc(100vh - 100px);
      animation: smoothFadeDown 0.35s cubic-bezier(.25,.8,.25,1);
    }

    .tab h1 {

      background: linear-gradient(to top, #00acff, #00e4ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 20px;

      margin: 15px 0;
    }

      max-width: 900px;
      margin: 10px auto;
    }

      grid-template-columns: repeat(auto-fit, minmax(150px, 150px));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      justify-content: center;
    }

    .icon-card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.25s ease, background 0.2s ease, opacity 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 150px;
      height: 150px;
      padding: 10px;
      gap: 8px;
      opacity: 1;
      transform: translateY(0);
    }

    .icon-card.hidden {
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
    }

    .icon-card:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.12);
      z-index: 10;
    }

    .icon-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 5px;
    }

    .icon-card p {
      font-size: 0.85rem;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);

      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;

        channelIcon: "https://yt3.googleusercontent.com/eOf8nXBuZDNayF6uwfcwXUFFPDC0mi48_2OOu_cmhuuBwb1dObh96hh3kMUldweYRpt8T0hh=s160-c-k-c0x00ffffff-no-rj"
      },
      {
        title: "How to apply wraps on guns for rivals gfx",
        youtube: "VkMINqvy46Q",
        channelIcon: "https://yt3.googleusercontent.com/eOf8nXBuZDNayF6uwfcwXUFFPDC0mi48_2OOu_cmhuuBwb1dObh96hh3kMUldweYRpt8T0hh=s160-c-k-c0x00ffffff-no-rj"
      },
      {
        title: "How To Make VIRAL Roblox Thumbnails.. | (Complete Roblox Thumbnail Tutorial)",
        youtube: "lmxen_1gaUw",
        channelIcon: "https://yt3.googleusercontent.com/dy2Kf42SjVjVSWEtMzQfUYBFWFeKChtfW8gluIOx5IFUbMrXthP4QoVj0RALtySd8GXwP8POvQ=s160-c-k-c0x00ffffff-no-rj"
      },
      {
        title: "Key Weapon Texture Fix",
        youtube: "aYpmnjILSJU",
        channelIcon: "https://yt3.googleusercontent.com/eOf8nXBuZDNayF6uwfcwXUFFPDC0mi48_2OOu_cmhuuBwb1dObh96hh3kMUldweYRpt8T0hh=s160-c-k-c0x00ffffff-no-rj"
      }
    ]
  };
    

  let iconsLoaded = false;
  let rbxlLoaded = false;
  let psdLoaded = false;
  let tutorialsLoaded = false;

  function showTab(tabId, button) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');

    document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active-tab'));
    button.classList.add('active-tab');

    const searchBar = document.getElementById("icon-search-bar");
    searchBar.style.display = tabId === "icons" ? "flex" : "none";

    if (tabId === "icons" && !iconsLoaded) {
      generateIcons();
      iconsLoaded = true;
    }

    if (tabId === "rbxls" && !rbxlLoaded) {
      generateRBXL();
      rbxlLoaded = true;
    }

    if (tabId === "psds" && !psdLoaded) {
      generatePSDs();
      psdLoaded = true;
    }

    if (tabId === "tutorials" && !tutorialsLoaded) {
      generateTutorials();
      tutorialsLoaded = true;
    }
  }

  function generateIcons() {
    const container = document.getElementById("icons-container");
    container.innerHTML = "";

    Object.keys(iconsData).forEach(category => {
      const title = document.createElement("h2");
      title.textContent = category;
      container.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "icons-grid";

      iconsData[category].forEach(iconName => {
        const card = document.createElement("div");
        card.className = "icon-card";
        card.onclick = () => openPopup(`Icons/${iconName}.png`, formatLabel(iconName));

        card.innerHTML = `
          <img src="Icons/${iconName}.png" loading="lazy">
          <p>${formatLabel(iconName)}</p>
        `;

        grid.appendChild(card);
      });

      container.appendChild(grid);
    });
  }

  function generateRBXL() {
  const container = document.getElementById("rbxl-container");
  container.innerHTML = "";

  Object.keys(rbxlData).forEach(section => {
    const title = document.createElement("h2");
    title.textContent = section;
    container.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "icons-grid";

    rbxlData[section].forEach(file => {
      const card = document.createElement("div");
      card.className = "icon-card";
      card.onclick = () => openPopup(file.url, file.title, "RBXL.png");

      card.innerHTML = `
        <img src="RBXL.png" loading="lazy">
        <p>${file.title}</p>
      `;

      grid.appendChild(card);
    });

    container.appendChild(grid);
  });
}

  function generatePSDs() {
  const container = document.getElementById("psd-container");
  container.innerHTML = "";

  Object.keys(psdData).forEach(section => {
    const title = document.createElement("h2");
    title.textContent = section;
    container.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "icons-grid";

    psdData[section].forEach(name => {
      const card = document.createElement("div");
      card.className = "icon-card";
      card.onclick = () => openPopup(`PSDs/${name}.psd`, name, "PSD.png");

      card.innerHTML = `
        <img src="PSD.png" loading="lazy">
        <p>${name.replace(" (Editable)", "")}</p>
      `;

      grid.appendChild(card);
    });

    container.appendChild(grid);
  });
}

  function formatLabel(name) {
    return name
      .replace(/([a-z])([A-Z])/g, '$1 $2')
      .trim();
  }
  function openPopup(fileSrc, altText = "Asset Preview", previewSrc = null) {
    const overlay = document.getElementById('popup-overlay');
    const popupImage = document.getElementById('popup-image');
    const popupLabel = document.getElementById('popup-label');

    popupImage.onerror = () => {
      popupImage.style.display = "none";
    };

    popupImage.dataset.fileSrc = fileSrc;
    popupLabel.textContent = altText;

    if (previewSrc) {
      popupImage.src = previewSrc;
      popupImage.style.display = "block";
    } else {
      popupImage.src = fileSrc;
      popupImage.style.display = "block";
    }

    overlay.classList.add('active');
  }

  function closePopup() {
    document.getElementById('popup-overlay').classList.remove('active');
  }

  function downloadImage() {
    const fileSrc = document.getElementById('popup-image').dataset.fileSrc;
    const label = document.getElementById('popup-label').textContent;

    const link = document.createElement('a');
    link.href = fileSrc;

    const ext = fileSrc.split('.').pop();
    link.download = (label || "asset") + "." + ext;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePopup();
  });

  function generateTutorials() {
    const container = document.getElementById("tutorials-container");
    container.innerHTML = "";

    Object.keys(tutorialsData).forEach(section => {

      const title = document.createElement("h2");
      title.textContent = section;
      container.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "tutorials-grid";

      tutorialsData[section].forEach(video => {

        const card = document.createElement("div");
        card.className = "tutorial-card";

        const thumbnail = `https://img.youtube.com/vi/${video.youtube}/hqdefault.jpg`;

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${thumbnail}" loading="lazy">
            <img class="channel-avatar-glow" src="${video.channelIcon}">
            <img class="channel-avatar" src="${video.channelIcon}">
          </div>
          <p>${video.title}</p>
        `;

        card.onclick = () => {
          window.open(`https://youtube.com/watch?v=${video.youtube}`, "_blank");
        };

        grid.appendChild(card);
      });

      container.appendChild(grid);
    });
  }

  function searchIcons() {
    const query = document.getElementById("icon-search").value.toLowerCase();
    const container = document.getElementById("icons-container");
    const sections = container.querySelectorAll("h2");
    const noResults = document.getElementById("no-results");

    let totalMatches = 0;

    sections.forEach(title => {
      const grid = title.nextElementSibling;
      const cards = grid.querySelectorAll(".icon-card");

      let categoryMatches = 0;

      cards.forEach(card => {
        const text = card.textContent.toLowerCase();

        if (text.includes(query)) {
          card.style.display = "flex";

          requestAnimationFrame(() => {
            card.classList.remove("hidden");
          });

          categoryMatches++;
          totalMatches++;
        } else {
          card.classList.add("hidden");

          setTimeout(() => {
            card.style.display = "none";
          }, 200);
        }
      });

      if (categoryMatches === 0) {
        title.style.display = "none";
        grid.style.display = "none";
      } else {
        title.style.display = "block";
        grid.style.display = "grid";
      }
    });

    noResults.style.display = totalMatches === 0 ? "block" : "none";
  }

  const searchWrapper = document.getElementById("search-wrapper");
  const searchInput = document.getElementById("icon-search");

  searchWrapper.addEventListener("click", () => {
    searchWrapper.classList.add("expanded");
    searchInput.focus();
  });

  document.addEventListener("click", (e) => {
    if (!searchWrapper.contains(e.target)) {

      if (searchInput.value === "") {
        searchWrapper.classList.remove("expanded");
      }

    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/") {
      e.preventDefault();
      searchWrapper.classList.add("expanded");
      searchInput.focus();
    }
  });
</script>
